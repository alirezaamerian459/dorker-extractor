[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorklink-extractor"
version = "1.0.0"
description = "A scoped desktop crawler for discovering and verifying public file links on authorized websites."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "playwright>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dorklink-extractor = "dorklink.gui:main"

[tool.setuptools.packages.find]
include = ["dorklink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
